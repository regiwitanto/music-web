name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      # Node 24 LTS (owner decision, 2026-11-05, 001 T001).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage

      # Normal production build with NEXT_PUBLIC_TEST_HOOKS unset, then the
      # branding and test-hook exclusion scan (ui-shell.md §7.2).
      - run: pnpm build
      - run: pnpm scan:branding

      - run: pnpm exec playwright install --with-deps

      # The test-hooks build is used only for E2E. The flag is set on this one
      # step and never at job or workflow level.
      - name: Build with test hooks for E2E
        run: pnpm build
        env:
          NEXT_PUBLIC_TEST_HOOKS: '1'

      - run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
